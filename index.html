<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Calendar | 13-Month Lunar Calendar System</title>
    <meta name="description"
        content="A natural calendar system with 13 months of 28 days each, aligned with Earth's equinox and lunar cycles. Experience time as nature intended.">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Natural Calendar | Aligned with Earth & Moon">
    <meta property="og:description"
        content="A 13-month calendar system with 28-day months, synchronized with the Vernal Equinox and lunar phases.">
    <meta property="og:image" content="https://example.com/preview.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Natural Calendar">
    <meta name="twitter:description"
        content="Experience a calendar aligned with natural rhythms - 13 months, 28 days each.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Styles -->
  <script type="module" crossorigin src="/natural-calendar/assets/main-CAoBlsBD.js"></script>
  <link rel="stylesheet" crossorigin href="/natural-calendar/assets/input-Bfaw7nBh.css">
</head>

<body class="h-screen overflow-hidden bg-background flex flex-col transition-colors duration-200 dark">
    <!-- Cosmos background with stars (theme-aware opacity) -->
    <div id="starsBackground" class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none transition-opacity duration-200" style="opacity: var(--stars-opacity);"></div>

    <!-- Top Navigation Bar -->
    <nav class="bg-card/80 backdrop-blur-xl px-6 py-4">
        <div class="flex items-center justify-between max-w-[1800px] mx-auto">
            <!-- Left: Logo and Title -->
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-extralight uppercase text-foreground">Natural Calendar</h1>
                <a href="about.html" class="text-xs text-accent hover:opacity-80 transition-colors">About</a>
            </div>

            <!-- Center: Date Navigation -->
            <div class="flex items-center gap-4">
                <button id="prevBtn" class="bg-secondary text-secondary-foreground w-10 h-10 rounded-md cursor-pointer hover:bg-secondary/80 transition-all flex items-center justify-center">
                    <span class="text-lg">‹</span>
                </button>
                <button id="nextBtn" class="bg-secondary text-secondary-foreground w-10 h-10 rounded-md cursor-pointer hover:bg-secondary/80 transition-all flex items-center justify-center">
                    <span class="text-lg">›</span>
                </button>
                <div class="ml-4">
                    <button id="dateDisplay" class="text-foreground text-lg font-light hover:bg-secondary px-4 py-2 rounded-md transition-all cursor-pointer">Natural Year 2026</button>
                </div>
            </div>

            <!-- Right: View Switcher and Controls -->
            <div class="flex items-center gap-4">
                <button id="todayBtn" class="bg-secondary text-secondary-foreground px-6 py-2 rounded-md cursor-pointer hover:bg-secondary/80 transition-all font-medium">Today</button>
                <button id="themeToggle" class="bg-secondary text-secondary-foreground w-10 h-10 rounded-md cursor-pointer hover:bg-secondary/80 transition-all flex items-center justify-center" title="Toggle light/dark mode">
                    <span id="themeIcon">🌙</span>
                </button>
                <div class="flex bg-muted p-1 rounded-lg gap-1">
                    <button id="viewYear" class="px-4 py-2 text-sm rounded-md transition-all bg-accent text-accent-foreground font-semibold">Year</button>
                    <button id="viewMonth" class="px-4 py-2 text-sm rounded-md transition-all text-muted-foreground hover:text-foreground hover:bg-secondary">Month</button>
                    <button id="viewWeek" class="px-4 py-2 text-sm rounded-md transition-all text-muted-foreground hover:text-foreground hover:bg-secondary">Week</button>
                    <button id="viewDay" class="px-4 py-2 text-sm rounded-md transition-all text-muted-foreground hover:text-foreground hover:bg-secondary">Day</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Calendar Area -->
    <main class="flex-1 overflow-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:bg-muted [&::-webkit-scrollbar-thumb]:rounded [&::-webkit-scrollbar-track]:bg-transparent">
        <div id="calendarContainer" class="w-full p-6 pb-20">
            <!-- Calendar views will be rendered here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 left-0 right-0 bg-card/90 backdrop-blur-sm py-3 px-8 z-10">
        <div class="max-w-[1800px] mx-auto text-center">
            <p class="text-muted-foreground text-xs">
                Created by <a href="https://www.maximoff.studio" target="_blank" rel="noopener noreferrer" class="text-accent hover:underline font-semibold">maximoff.studio</a>
            </p>
        </div>
    </footer>

    <!-- Hidden date picker for date selection -->
    <input type="date" id="hiddenDatePicker" class="hidden">

</body>

</html>
